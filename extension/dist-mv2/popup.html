<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Interceptor</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      width: 260px;
      padding: 16px;
      background: #fff;
      color: #111;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #444;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }
    input:focus { border-color: #0071e3; }
    .row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    #save {
      background: #0071e3;
      color: #fff;
    }
    #save:hover { background: #005bb5; }
    #reset {
      background: #f0f0f0;
      color: #333;
    }
    #reset:hover { background: #e0e0e0; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      min-height: 16px;
    }
    #connectionHealth {
      margin-bottom: 14px;
      padding: 10px;
      border: 1px solid #d2d2d7;
      border-radius: 7px;
      background: #f5f5f7;
    }
    #connectionHealth[data-state="connected"] { border-color: #64a86b; background: #eef8ef; }
    #connectionHealth[data-state="disconnected"] { border-color: #d06b64; background: #fff2f1; }
    #connectionHealth .connection-detail { margin: 4px 0 8px; color: #5f6368; font-size: 12px; }
    #connectionHealth a { color: #0057b8; font-weight: 600; text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1c1e; color: #f5f5f7; }
      label { color: #d1d1d6; }
      input { color: #f5f5f7; background: #2c2c2e; border-color: #636366; }
      #reset { color: #f5f5f7; background: #3a3a3c; }
      #reset:hover { background: #48484a; }
      #status { color: #aeaeb2; }
      #connectionHealth { color: #f5f5f7; background: #2c2c2e; border-color: #636366; }
      #connectionHealth[data-state="connected"] { border-color: #5bbf68; background: #19351d; }
      #connectionHealth[data-state="disconnected"] { border-color: #ff6961; background: #3b1d1b; }
      #connectionHealth .connection-detail { color: #d1d1d6; }
      #connectionHealth a { color: #64d2ff; }
    }
  </style>
</head>
<body>
  <div id="connectionHealth" data-state="connecting" role="status" aria-live="polite">
    <strong>Checking Interceptor daemon...</strong>
  </div>
  <label for="contextId">Context ID</label>
  <input id="contextId" type="text" placeholder="e.g. work, personal, …" spellcheck="false">
  <div class="row">
    <button id="save">Save</button>
    <button id="reset">Reset</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
